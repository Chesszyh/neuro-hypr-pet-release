name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 15
    steps:
      - name: Install system dependencies
        run: dnf install -y git python3 python3-gobject python3-cairo python3-pillow gobject-introspection gtk4 gtk4-layer-shell
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run tests without artwork
        env:
          GTK_A11Y: none
        run: python3 -m unittest discover -s tests -v

  macos-core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Create Python environment
        run: python3 -m venv .venv-macos
      - name: Install locked native dependencies
        run: .venv-macos/bin/python -m pip install -r packaging/macos/requirements.lock
      - name: Run core and macOS adapter tests without opening windows
        run: .venv-macos/bin/python tools/run_core_tests.py
