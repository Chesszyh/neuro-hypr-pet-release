name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 15
    steps:
      - name: Install system dependencies
        run: dnf install -y git python3 python3-gobject python3-cairo python3-pillow gobject-introspection gtk4 gtk4-layer-shell
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run tests without artwork
        env:
          GTK_A11Y: none
        run: python3 -m unittest discover -s tests -v
